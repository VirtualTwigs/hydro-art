[project]
name = "hydro-art"
version = "1.0.0"
description = "Automated GIS-to-SVG pipeline for original hydrographic vector art."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hydro-art = "build:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_data'"
markers = ["real_data: requires GDAL + NAS + HYDRO_ART_REAL_DATA=1 (not part of the offline suite)"]

[tool.ruff]
line-length = 88

# Coverage is scoped to src/ and honors the existing `# pragma: no cover` markers on
# env-dependent import guards. GDAL/network/subprocess seam bodies (e.g. counties.load,
# download fetch, loading GDAL read, server handlers) are offline-untestable by design and
# are covered instead by injected fakes at their call sites — see the Epoch 20 report.
[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
