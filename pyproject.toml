[project]
name = "hydro-art"
version = "0.1.0"
description = "Automated GIS-to-SVG pipeline for original hydrographic vector art."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hydro-art = "build:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
