# ALTERNATIVE to the live-app proxy: static demo at https://riverglyph.enablesu.com
# (Cloudflare Tunnel -> localhost:8081 -> this container). See deploy/CLOUDFLARE.md.
#
#   docker compose -f deploy/docker-compose.riverglyph.yml up --build -d
#
# Same static image as docker-compose.yml, but:
#   * runs auth_server.py (HTTP Basic Auth; refuses to start without credentials)
#   * credentials come from deploy/riverglyph.env (git-ignored; see .example)
#   * bound to 127.0.0.1 only, so the ONLY way in from outside is the tunnel
services:
  riverglyph:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hydro-art-demo:latest
    container_name: riverglyph
    command: ["python", "auth_server.py", "--port", "8080"]
    env_file:
      - ./riverglyph.env
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./output:/app/output:ro
    restart: unless-stopped
