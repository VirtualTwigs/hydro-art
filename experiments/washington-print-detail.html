<!doctype html>

  <title>Washington / Print Detail</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600&display=swap');
    *{box-sizing:border-box}body{margin:0;background:#d9d8d0;color:#1d2926;font-family:Manrope,sans-serif}nav{padding:20px 5vw;font:11px DM Mono,monospace;letter-spacing:.08em}a{color:inherit}main{max-width:1450px;margin:auto;padding:15px 5vw 70px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:30px}.print{box-shadow:0 22px 48px #62665d55;min-width:0}.print svg{display:block;width:100%;height:auto}.info{padding-top:16px;border-top:2px solid #1d2926}.info .eyebrow{font:10px DM Mono,monospace;letter-spacing:.12em;color:#2c7474}.info h1{font:600 36px/.95 Fraunces,serif;letter-spacing:-.05em;margin:16px 0}.info p{font-size:13px;line-height:1.6;color:#52615b}.note{font:10px DM Mono,monospace;line-height:1.8;color:#64736b;text-transform:uppercase}@media(max-width:760px){main{grid-template-columns:1fr}.info{display:grid;grid-template-columns:1fr 1fr;gap:18px}.info h1{font-size:28px;margin:8px 0}}@media(max-width:450px){.info{display:block}}
  </style>
</head>
<body><nav><a href="washington-print-gallery.html">← ALL WASHINGTON EDITIONS</a></nav><main><div class="print" id="print"></div><aside class="info"><div><div class="eyebrow" id="kicker"></div><h1 id="title"></h1><p id="description"></p></div><div class="note">FULL-DETAIL VECTOR PREVIEW<br>SCALABLE SVG ARTWORK<br>ARCHIVAL PIGMENT INK<br>UNCOATED COTTON RAG</div></aside></main>
  <script>
    const ed={specimen:['The Specimen','#f1efe7','#215e64','A quiet topographic field note. Fine contour lines give the state a textured, almost geological presence while the river network stays spare and legible.'],rain:['Rain Country','#1a3035','#8bd0cf','An evening-blue study of the state’s famously abundant water. This edition lets tributaries accumulate into a luminous, close-looking network.'],divide:['The Divide','#e8bd5b','#194b58','A graphic basin composition: water becomes a way to read the large-scale divisions in Washington’s landscape.'],nocturne:['Cascade Nocturne','#101d2e','#efc47b','A dark-room atlas in warm copper ink, designed to read dramatically from across the room and reveal data-rich detail up close.'],field:['Living Index','#e9e0c4','#276b5d','A field-guide print that makes the water system approachable through carefully indexed tributaries, habitat marks, and place labels.']};
    const requested=new URLSearchParams(location.search).get('edition');const key=ed[requested]?requested:'specimen';const [title,paper,river,desc]=ed[key];document.title='Washington / '+title;document.querySelector('#title').textContent=title;document.querySelector('#description').textContent=desc;document.querySelector('#kicker').textContent='WASHINGTON STATE / '+key.toUpperCase()+' EDITION';
    const contour=Array.from({length:42},(_,i)=>{const y=150+i*14;return `<path d="M120 ${y} C 255 ${y-64} 365 ${y+54} 510 ${y-18} S 735 ${y-20} 910 ${y+22}"/>`}).join('');
    const streams=Array.from({length:54},(_,i)=>{const x=170+(i%9)*69,y=165+Math.floor(i/9)*70;return `<path d="M${x} ${y}q${30+(i%4)*11} ${22-(i%3)*15} ${48+(i%5)*8} ${52+(i%4)*9}"/>`}).join('');
    document.querySelector('#print').innerHTML=`<svg viewBox="0 0 1200 900" role="img" aria-label="Detailed map of Washington State"><defs><clipPath id="wa"><path d="M190 151L816 150 826 236 865 257 853 429 812 450 837 625 752 718 652 781 522 766 417 801 294 747 202 661 232 560 186 493 213 392 167 302 202 241Z"/></clipPath><filter id="soft"><feGaussianBlur stdDeviation="2"/></filter></defs><rect width="1200" height="900" fill="${paper}"/><text x="77" y="85" font-family="Fraunces" font-size="51" fill="${river}">${title}</text><text x="80" y="116" font-family="DM Mono" font-size="13" letter-spacing="2" fill="${river}" opacity=".8">WASHINGTON STATE · HYDROGRAPHIC EDITION · 1:1,150,000</text><g clip-path="url(#wa)" fill="none" stroke="${river}" opacity=".23" stroke-width="1">${contour}</g><path d="M190 151L816 150 826 236 865 257 853 429 812 450 837 625 752 718 652 781 522 766 417 801 294 747 202 661 232 560 186 493 213 392 167 302 202 241Z" fill="none" stroke="${river}" stroke-width="2.2"/><g clip-path="url(#wa)" fill="none" stroke="${river}" stroke-linecap="round">${streams}</g><g clip-path="url(#wa)" fill="none" stroke="${river}" stroke-linecap="round"><path d="M281 188C410 297 347 362 480 432S555 553 626 745" stroke-width="9"/><path d="M691 182C600 298 637 350 526 429M236 446C364 412 384 445 480 432M763 359C648 409 646 468 554 517M320 662C433 601 529 652 626 745" stroke-width="3.4"/></g><g fill="${river}"><circle cx="480" cy="432" r="8"/><circle cx="626" cy="745" r="6"/><circle cx="554" cy="517" r="5"/></g><g font-family="DM Mono" font-size="12" fill="${river}"><text x="308" y="282">OLYMPIC</text><text x="492" y="300">CASCADE</text><text x="655" y="545">COLUMBIA</text><text x="845" y="739">PACIFIC</text></g><line x1="78" y1="833" x2="1120" y2="833" stroke="${river}" opacity=".45"/><text x="80" y="858" font-family="DM Mono" font-size="12" fill="${river}">HYDRO-ART / WASHINGTON EDITION / HIGH-RES VECTOR STUDY</text><text x="988" y="858" font-family="DM Mono" font-size="12" fill="${river}">2026</text></svg>`;
  </script>
</body></html>
