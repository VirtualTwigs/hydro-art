<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow-soft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: bold 28px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8f4ff; }
      .subtitle { font: 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b8da6; }
      .label-tier1 { font: bold 18px 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 5px; text-transform: uppercase; }
      .label-tier2 { font: 600 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; }
      .label-tier3 { font: 300 9px 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
      .overall-title { font: bold 32px 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 8px; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="900" height="700" fill="#0a0a12"/>

  <text x="450" y="48" class="title" text-anchor="middle">Concept 3: Neon Tier System</text>
  <text x="450" y="68" class="subtitle" text-anchor="middle">Labels glow like the rivers  ·  3 tiers by stream order  ·  overall title as marquee</text>

  <!-- Overall graphic title — big, glowing, at top -->
  <text x="450" y="120" class="overall-title" text-anchor="middle" fill="#e8f4ff" fill-opacity="0.15" filter="url(#text-glow)">COLUMBIA BASIN</text>

  <!-- Rivers -->
  <g filter="url(#glow)">
    <path d="M 80,340 Q 200,320 300,350 Q 400,380 500,360 Q 600,340 720,330 L 850,340" stroke="#00ffff" stroke-width="5"/>
    <path d="M 250,160 Q 280,210 300,270 Q 310,310 300,350" stroke="#0a5cff" stroke-width="3.5"/>
    <path d="M 180,180 Q 220,195 250,215 Q 270,230 280,248" stroke="#0a5cff" stroke-width="1.5"/>
    <path d="M 350,560 Q 380,510 400,450 Q 420,410 440,390 Q 470,370 500,360" stroke="#9d00ff" stroke-width="3"/>
    <path d="M 460,580 Q 440,530 420,470 Q 410,445 400,425" stroke="#9d00ff" stroke-width="1.5"/>
    <path d="M 700,160 Q 680,220 660,270 Q 640,310 640,340" stroke="#00ffab" stroke-width="2.5"/>
    <path d="M 600,510 Q 620,465 640,415 Q 660,375 680,350" stroke="#ff7a00" stroke-width="2"/>
    <path d="M 140,290 Q 160,310 180,325 Q 200,335 220,338" stroke="#00ffff" stroke-width="1"/>
  </g>

  <!-- Tier 1: Major rivers — large glowing labels -->
  <g filter="url(#text-glow)">
    <text x="600" y="325" class="label-tier1" fill="#00ffff" fill-opacity="0.85" text-anchor="middle" transform="rotate(-2, 600, 325)">COLUMBIA</text>
  </g>

  <!-- Tier 2: Named tributaries — medium glowing labels -->
  <g filter="url(#text-glow-soft)">
    <text x="260" y="200" class="label-tier2" fill="#0a5cff" fill-opacity="0.7" text-anchor="middle" transform="rotate(-70, 260, 200)">NORTH FORK</text>
    <text x="425" y="480" class="label-tier2" fill="#9d00ff" fill-opacity="0.7" text-anchor="middle" transform="rotate(70, 425, 480)">SOUTH FORK</text>
    <text x="665" y="215" class="label-tier2" fill="#00ffab" fill-opacity="0.7" text-anchor="middle" transform="rotate(78, 665, 215)">PINE RIVER</text>
    <text x="640" y="460" class="label-tier2" fill="#ff7a00" fill-opacity="0.65" text-anchor="middle" transform="rotate(70, 640, 460)">DEER CREEK</text>
  </g>

  <!-- Tier 3: Small creeks — faint, small -->
  <text x="200" y="195" class="label-tier3" fill="#0a5cff" fill-opacity="0.35" text-anchor="middle" transform="rotate(-28, 200, 195)">CEDAR CR</text>
  <text x="445" y="545" class="label-tier3" fill="#9d00ff" fill-opacity="0.35" text-anchor="middle" transform="rotate(66, 445, 545)">ELK CR</text>
  <text x="165" y="310" class="label-tier3" fill="#00ffff" fill-opacity="0.3" text-anchor="middle" transform="rotate(-25, 165, 310)">SPRING CR</text>

  <text x="450" y="680" class="subtitle" text-anchor="middle">Pro: matches art aesthetic, hierarchy clear  ·  Con: all-caps can feel aggressive, glow hides detail at small sizes</text>
</svg>
