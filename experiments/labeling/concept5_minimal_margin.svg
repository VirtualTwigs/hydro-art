<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: bold 28px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8f4ff; }
      .subtitle { font: 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b8da6; }
      .margin-name { font: 300 10px 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 1.5px; }
      .margin-dot { }
      .graphic-title { font: 100 42px 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 12px; text-transform: uppercase; }
      .graphic-sub { font: 300 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 4px; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="900" height="700" fill="#0a0a12"/>

  <text x="450" y="38" class="title" text-anchor="middle">Concept 5: Minimal Margin Index</text>
  <text x="450" y="56" class="subtitle" text-anchor="middle">Rivers unlabeled in the art  ·  color-coded index in a quiet margin  ·  art stays clean</text>

  <!-- Overall title — thin, gallery-style, above the art -->
  <text x="450" y="110" class="graphic-title" fill="#e8f4ff" fill-opacity="0.12" text-anchor="middle">Columbia Basin</text>
  <text x="450" y="130" class="graphic-sub" fill="#e8f4ff" fill-opacity="0.08" text-anchor="middle">Pacific Northwest Hydrography</text>

  <!-- Rivers — completely unlabeled, pure art -->
  <g filter="url(#glow)">
    <path d="M 130,340 Q 240,320 340,350 Q 430,380 520,360 Q 610,340 720,330 L 820,340" stroke="#00ffff" stroke-width="5"/>
    <path d="M 290,170 Q 315,220 330,275 Q 340,315 335,350" stroke="#0a5cff" stroke-width="3.5"/>
    <path d="M 220,190 Q 255,205 285,225 Q 305,240 315,255" stroke="#0a5cff" stroke-width="1.5"/>
    <path d="M 390,550 Q 415,500 435,445 Q 450,410 470,390 Q 495,375 520,360" stroke="#9d00ff" stroke-width="3"/>
    <path d="M 490,570 Q 475,525 455,470 Q 447,445 435,425" stroke="#9d00ff" stroke-width="1.5"/>
    <path d="M 700,170 Q 685,225 670,275 Q 655,315 650,340" stroke="#00ffab" stroke-width="2.5"/>
    <path d="M 620,505 Q 635,465 650,420 Q 665,380 685,355" stroke="#ff7a00" stroke-width="2"/>
    <path d="M 180,300 Q 200,315 215,325 Q 235,335 260,340" stroke="#00ffff" stroke-width="1"/>
  </g>

  <!-- Margin index — right edge, color-coded legend -->
  <g transform="translate(0, 0)">
    <!-- Divider line -->
    <line x1="60" y1="590" x2="840" y2="590" stroke="#e8f4ff" stroke-opacity="0.06" stroke-width="0.5"/>

    <!-- Row 1 -->
    <circle cx="80" cy="620" r="4" fill="#00ffff" fill-opacity="0.8"/>
    <text x="92" y="623" class="margin-name" fill="#00ffff" fill-opacity="0.7">Columbia River</text>

    <circle cx="240" cy="620" r="4" fill="#0a5cff" fill-opacity="0.8"/>
    <text x="252" y="623" class="margin-name" fill="#0a5cff" fill-opacity="0.7">North Fork</text>

    <circle cx="380" cy="620" r="4" fill="#9d00ff" fill-opacity="0.8"/>
    <text x="392" y="623" class="margin-name" fill="#9d00ff" fill-opacity="0.7">South Fork</text>

    <circle cx="520" cy="620" r="4" fill="#00ffab" fill-opacity="0.8"/>
    <text x="532" y="623" class="margin-name" fill="#00ffab" fill-opacity="0.7">Pine River</text>

    <circle cx="660" cy="620" r="4" fill="#ff7a00" fill-opacity="0.8"/>
    <text x="672" y="623" class="margin-name" fill="#ff7a00" fill-opacity="0.7">Deer Creek</text>

    <!-- Row 2 — sub-creeks, dimmer -->
    <circle cx="80" cy="648" r="3" fill="#00ffff" fill-opacity="0.4"/>
    <text x="90" y="651" class="margin-name" fill="#00ffff" fill-opacity="0.35" font-size="8.5">Spring Cr.</text>

    <circle cx="200" cy="648" r="3" fill="#0a5cff" fill-opacity="0.4"/>
    <text x="210" y="651" class="margin-name" fill="#0a5cff" fill-opacity="0.35" font-size="8.5">Cedar Cr.</text>

    <circle cx="320" cy="648" r="3" fill="#9d00ff" fill-opacity="0.4"/>
    <text x="330" y="651" class="margin-name" fill="#9d00ff" fill-opacity="0.35" font-size="8.5">Elk Cr.</text>
  </g>

  <text x="450" y="685" class="subtitle" text-anchor="middle">Pro: art is pristine, index is scannable  ·  Con: user must visually match colors, doesn't work well at scale</text>
</svg>
