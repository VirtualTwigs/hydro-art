<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Riverglyph social preview">
  <style>
    .wordmark { font-family: Georgia, serif; font-size: 72px; font-weight: 600; letter-spacing: -0.045em; fill: #142923; }
    .tagline { font-family: Georgia, serif; font-size: 28px; fill: #40524a; }
    .letter { font-family: Georgia, serif; font-size: 132px; font-weight: 700; fill: #142923; }
    .g { font: 700 104px Georgia, serif; fill: #142923; }
    .shore { fill: none; stroke: #142923; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="630" fill="#F4F2E9"/>
  <!-- R/g monogram -->
  <g transform="translate(528, 100)">
    <text class="letter" x="14" y="112">R</text>
    <text class="g" x="72" y="111">g</text>
    <path class="shore" stroke-width="4" d="M8 129c39-11 87-9 131 0"/>
    <path class="shore" stroke-width="2" d="M19 135c34-6 72-5 109 0"/>
  </g>
  <!-- Wordmark -->
  <text class="wordmark" x="600" y="340" text-anchor="middle">Riverglyph</text>
  <!-- Double shore under wordmark -->
  <path class="shore" stroke-width="3" d="M310 360c80-10 220-10 580 0"/>
  <path class="shore" stroke-width="1.5" d="M340 368c70-6 200-6 520 0"/>
  <!-- Tagline -->
  <text class="tagline" x="600" y="420" text-anchor="middle">rivers, made to order</text>
</svg>
