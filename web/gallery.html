<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riverglyph · Gallery</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<meta property="og:title" content="Riverglyph · Gallery">
<meta property="og:description" content="Cartographic art shaped by the rivers beneath a place.">
<meta property="og:image" content="brand/social-preview.png">
<link rel="stylesheet" href="shared/ux.css" />
<style>
  body { max-width: 1180px; margin: 0 auto; padding: 20px 20px 60px; }
  header.gallery-head {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 6px;
  }
  header.gallery-head .spacer { flex: 1; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 0 0 14px; padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .toolbar .sel-count { color: var(--muted); font-size: 11px; }
  .toolbar .btn { padding: 7px 16px; margin: 0; }
  .filter-group { display: flex; gap: 6px; align-items: center; }
  .filter-group label { color: var(--muted); font-size: 11px; }
  .filter-group select { width: auto; min-width: 100px; padding: 5px 8px; font-size: 11px; }

  /* ---------- Grid ---------- */
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel-2); display: flex;
    flex-direction: column; overflow: hidden;
    transition: border-color .15s;
  }
  .card.selected { border-color: var(--accent-light); }
  .card .thumb {
    position: relative; background: var(--bg);
    display: grid; place-items: center;
    min-height: 200px; cursor: pointer;
    overflow: hidden;
  }
  .card .thumb img, .card .thumb object {
    max-width: 100%; max-height: 280px; object-fit: contain;
    display: block;
  }
  .card .thumb .no-preview {
    color: var(--muted); font-size: 11px; padding: 40px 20px;
    text-align: center;
  }
  .card .thumb .fmt-badge {
    position: absolute; top: 8px; right: 8px;
    font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink); background: rgba(0,0,0,.65);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 2px 7px;
  }
  .card .info {
    padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .card .info .row-top { display: flex; align-items: center; gap: 8px; }
  .card .fname {
    font-size: 12px; color: var(--ink); font-weight: 600;
    word-break: break-all; flex: 1;
  }
  .card .fsize { color: var(--muted); font-size: 10px; white-space: nowrap; }
  .card .actions { display: flex; gap: 6px; margin-top: 4px; }
  .card .actions .btn { padding: 5px 10px; font-size: 10px; width: auto; margin: 0; }

  .empty { color: var(--warn); padding: 40px 0; text-align: center; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.88); display: none;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox .lb-close {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none; color: var(--ink);
    font-size: 28px; cursor: pointer; z-index: 1001;
    line-height: 1;
  }
  .lightbox .lb-close:hover { color: var(--accent-light); }
  .lightbox .lb-img {
    max-width: 92vw; max-height: 82vh; object-fit: contain;
  }
  .lightbox .lb-fname {
    color: var(--muted); font-size: 12px; margin-top: 12px;
  }
  .lightbox .lb-actions { display: flex; gap: 8px; margin-top: 10px; }
  .lightbox .lb-actions .btn { width: auto; padding: 7px 18px; margin: 0; }
  /* ---------- Curated gallery sections ---------- */
  .gallery-section { margin-bottom: 32px; }
  .section-heading { font-size: 20px; margin: 0 0 4px; color: var(--ink); }
  .section-desc { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .entry-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .entry-desc { color: var(--muted); font-size: 12px; margin-bottom: 6px; line-height: 1.4; }
  .entry-meta { color: var(--muted); font-size: 11px; margin-bottom: 8px; }

  .lightbox .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,.5); border: 1px solid var(--line);
    color: var(--ink); font-size: 24px; padding: 12px 14px;
    cursor: pointer; border-radius: var(--radius-sm); line-height: 1;
  }
  .lightbox .lb-nav:hover { background: rgba(255,255,255,.08); color: var(--accent-light); }
  .lightbox .lb-prev { left: 12px; }
  .lightbox .lb-next { right: 12px; }
</style>
</head>
<body>
<header class="gallery-head">
  <h1 class="brand">Riverglyph</h1>
  <div class="sub" id="subtitle">Gallery</div>
  <div class="spacer"></div>
  <div class="sub" id="count"></div>
</header>

<!-- Curated gallery (shown when data/gallery.json exists) -->
<div id="curatedGallery" style="display:none;"></div>

<!-- Raw output browser (fallback when no curated gallery) -->
<div id="rawBrowser" style="display:none;">
  <div class="toolbar" id="toolbar">
    <div class="filter-group">
      <label>Format:</label>
      <select id="filterFmt">
        <option value="">All</option>
        <option value="png">PNG</option>
        <option value="svg">SVG</option>
        <option value="pdf">PDF</option>
      </select>
    </div>
    <div class="spacer"></div>
    <span class="sel-count" id="selCount"></span>
    <button class="btn" id="btnSelectAll">Select all</button>
    <button class="btn" id="btnClearSel">Clear</button>
    <button class="btn solid" id="btnDownload" disabled>Download selected</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev">&#8249;</button>
  <button class="lb-nav lb-next" id="lbNext">&#8250;</button>
  <img class="lb-img" id="lbImg" alt="" />
  <div class="lb-fname" id="lbFname"></div>
  <div class="lb-actions">
    <a class="btn solid" id="lbDownload" href="#" download>Download</a>
  </div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var allFiles = [];          // full API response
  var filtered = [];          // after format filter
  var selected = new Set();   // set of filenames
  var lbIndex = -1;           // current lightbox index in filtered[]

  // ---- Curated gallery rendering ----

  function renderCuratedGallery(data) {
    var container = $("curatedGallery");
    container.style.display = "";
    container.innerHTML = "";
    var sections = data.sections || [];
    var totalEntries = 0;

    sections.forEach(function (section) {
      if (!section.entries || !section.entries.length) return;
      totalEntries += section.entries.length;

      var sec = document.createElement("section");
      sec.className = "gallery-section";

      var heading = document.createElement("h2");
      heading.className = "section-heading";
      heading.textContent = section.display_name;
      sec.appendChild(heading);

      if (section.description) {
        var desc = document.createElement("p");
        desc.className = "section-desc";
        desc.textContent = section.description;
        sec.appendChild(desc);
      }

      var grid = document.createElement("div");
      grid.className = "grid";

      section.entries.forEach(function (entry) {
        var card = document.createElement("div");
        card.className = "card";

        var thumb = document.createElement("div");
        thumb.className = "thumb";
        if (entry.thumbnail) {
          var img = document.createElement("img");
          img.src = entry.thumbnail;
          img.alt = entry.title;
          img.loading = "lazy";
          thumb.appendChild(img);
        } else {
          var noP = document.createElement("div");
          noP.className = "no-preview";
          noP.textContent = "Preview coming soon";
          thumb.appendChild(noP);
        }
        card.appendChild(thumb);

        var info = document.createElement("div");
        info.className = "info";

        var title = document.createElement("div");
        title.className = "entry-title";
        title.textContent = entry.title;
        info.appendChild(title);

        if (entry.description) {
          var entryDesc = document.createElement("div");
          entryDesc.className = "entry-desc";
          entryDesc.textContent = entry.description;
          info.appendChild(entryDesc);
        }

        var meta = document.createElement("div");
        meta.className = "entry-meta";
        var parts = [entry.region];
        if (entry.county) parts.push(entry.county);
        parts.push(entry.style);
        meta.textContent = parts.join(" \u00b7 ");
        info.appendChild(meta);

        var actions = document.createElement("div");
        actions.className = "actions";
        var orderBtn = document.createElement("a");
        orderBtn.className = "btn solid";
        orderBtn.textContent = "Order";
        orderBtn.href = "order.html?region=" + encodeURIComponent(entry.region)
          + (entry.county ? "&county=" + encodeURIComponent(entry.county) : "")
          + "&style=" + encodeURIComponent(entry.style);
        actions.appendChild(orderBtn);
        info.appendChild(actions);

        card.appendChild(info);
        grid.appendChild(card);
      });

      sec.appendChild(grid);
      container.appendChild(sec);
    });

    $("count").textContent = totalEntries + " piece(s)";
    if (!totalEntries) {
      container.innerHTML = '<div class="empty">Gallery coming soon.</div>';
    }
  }

  // ---- Data fetching ----

  function fetchCuratedGallery() {
    fetch("data/gallery.json")
      .then(function (r) {
        if (!r.ok) throw new Error("not found");
        return r.json();
      })
      .then(function (data) {
        if (data.sections && data.sections.length) {
          renderCuratedGallery(data);
        } else {
          fallbackToOutputBrowser();
        }
      })
      .catch(function () {
        fallbackToOutputBrowser();
      });
  }

  function fallbackToOutputBrowser() {
    $("rawBrowser").style.display = "";
    $("subtitle").textContent = "Output gallery";
    fetchOutputs();
  }

  function fetchOutputs() {
    fetch("/api/gallery/outputs")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        allFiles = data.files || [];
        applyFilter();
      })
      .catch(function () {
        $("grid").innerHTML = '<div class="empty">Could not load outputs. Is the dev server running?</div>';
      });
  }

  // ---- Filtering ----

  function applyFilter() {
    var fmt = $("filterFmt").value;
    filtered = fmt
      ? allFiles.filter(function (f) { return f.fmt === fmt; })
      : allFiles.slice();
    renderGrid();
    updateSelectionUI();
  }

  // ---- Rendering ----

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function makeCard(file, idx) {
    var card = document.createElement("div");
    card.className = "card" + (selected.has(file.name) ? " selected" : "");
    card.dataset.name = file.name;

    // Thumbnail area
    var thumb = document.createElement("div");
    thumb.className = "thumb";
    if (file.preview) {
      if (file.fmt === "svg") {
        var obj = document.createElement("img");
        obj.src = file.preview;
        obj.alt = file.name;
        obj.loading = "lazy";
        thumb.appendChild(obj);
      } else {
        var img = document.createElement("img");
        img.src = file.preview;
        img.alt = file.name;
        img.loading = "lazy";
        thumb.appendChild(img);
      }
    } else {
      var noP = document.createElement("div");
      noP.className = "no-preview";
      noP.textContent = file.fmt.toUpperCase() + " — no preview available";
      thumb.appendChild(noP);
    }

    var badge = document.createElement("span");
    badge.className = "fmt-badge";
    badge.textContent = file.fmt.toUpperCase();
    thumb.appendChild(badge);

    thumb.addEventListener("click", function () {
      if (file.preview) openLightbox(idx);
    });
    card.appendChild(thumb);

    // Info area
    var info = document.createElement("div");
    info.className = "info";

    var rowTop = document.createElement("div");
    rowTop.className = "row-top";

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(file.name);
    cb.style.cssText = "accent-color: var(--accent-light); cursor: pointer;";
    cb.addEventListener("change", function () {
      toggleSelect(file.name, cb.checked);
    });
    rowTop.appendChild(cb);

    var fname = document.createElement("span");
    fname.className = "fname";
    fname.textContent = file.name;
    rowTop.appendChild(fname);

    var fsize = document.createElement("span");
    fsize.className = "fsize";
    fsize.textContent = fmtSize(file.size);
    rowTop.appendChild(fsize);

    info.appendChild(rowTop);

    var actions = document.createElement("div");
    actions.className = "actions";

    if (file.preview) {
      var viewBtn = document.createElement("button");
      viewBtn.className = "btn ghost";
      viewBtn.textContent = "Preview";
      viewBtn.addEventListener("click", function () { openLightbox(idx); });
      actions.appendChild(viewBtn);
    }

    var dlBtn = document.createElement("a");
    dlBtn.className = "btn";
    dlBtn.textContent = "Download";
    dlBtn.href = file.url;
    dlBtn.download = file.name;
    actions.appendChild(dlBtn);

    info.appendChild(actions);
    card.appendChild(info);

    return card;
  }

  function renderGrid() {
    var grid = $("grid");
    grid.innerHTML = "";
    $("count").textContent = filtered.length + " file(s)";
    if (!filtered.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = allFiles.length
        ? "No files match this filter."
        : "No rendered outputs found in output/.";
      grid.appendChild(empty);
      return;
    }
    filtered.forEach(function (file, idx) {
      grid.appendChild(makeCard(file, idx));
    });
  }

  // ---- Selection ----

  function toggleSelect(name, on) {
    if (on) selected.add(name); else selected.delete(name);
    // Update card visual
    var cards = document.querySelectorAll(".card");
    cards.forEach(function (c) {
      if (c.dataset.name === name) {
        c.classList.toggle("selected", on);
        var cb = c.querySelector("input[type=checkbox]");
        if (cb) cb.checked = on;
      }
    });
    updateSelectionUI();
  }

  function updateSelectionUI() {
    var n = selected.size;
    $("selCount").textContent = n ? n + " selected" : "";
    $("btnDownload").disabled = n === 0;
  }

  function selectAll() {
    filtered.forEach(function (f) { selected.add(f.name); });
    renderGrid();
    updateSelectionUI();
  }

  function clearSelection() {
    selected.clear();
    renderGrid();
    updateSelectionUI();
  }

  function downloadSelected() {
    // Download each selected file by creating temporary links
    var toDownload = allFiles.filter(function (f) { return selected.has(f.name); });
    toDownload.forEach(function (f, i) {
      setTimeout(function () {
        var a = document.createElement("a");
        a.href = f.url;
        a.download = f.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, i * 200); // stagger to avoid browser throttling
    });
  }

  // ---- Lightbox ----

  function openLightbox(idx) {
    lbIndex = idx;
    showLightboxImage();
    $("lightbox").classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    $("lightbox").classList.remove("open");
    document.body.style.overflow = "";
    lbIndex = -1;
  }

  function showLightboxImage() {
    var file = filtered[lbIndex];
    if (!file) return;
    $("lbImg").src = file.preview || "";
    $("lbFname").textContent = file.name + "  ·  " + fmtSize(file.size);
    $("lbDownload").href = file.url;
    $("lbDownload").download = file.name;
    // Nav visibility
    $("lbPrev").style.display = lbIndex > 0 ? "" : "none";
    $("lbNext").style.display = lbIndex < filtered.length - 1 ? "" : "none";
  }

  function lbNav(delta) {
    // Only navigate to items with previews
    var next = lbIndex + delta;
    while (next >= 0 && next < filtered.length && !filtered[next].preview) {
      next += delta;
    }
    if (next >= 0 && next < filtered.length) {
      lbIndex = next;
      showLightboxImage();
    }
  }

  // ---- Event wiring ----

  $("filterFmt").addEventListener("change", applyFilter);
  $("btnSelectAll").addEventListener("click", selectAll);
  $("btnClearSel").addEventListener("click", clearSelection);
  $("btnDownload").addEventListener("click", downloadSelected);
  $("lbClose").addEventListener("click", closeLightbox);
  $("lbPrev").addEventListener("click", function () { lbNav(-1); });
  $("lbNext").addEventListener("click", function () { lbNav(1); });

  // Close lightbox on backdrop click
  $("lightbox").addEventListener("click", function (e) {
    if (e.target === $("lightbox")) closeLightbox();
  });

  // Keyboard nav in lightbox
  document.addEventListener("keydown", function (e) {
    if (!$("lightbox").classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") lbNav(-1);
    if (e.key === "ArrowRight") lbNav(1);
  });

  // ---- Boot ----
  fetchCuratedGallery();
})();
</script>
</body>
</html>
