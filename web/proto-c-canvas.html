<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hydro-Art · Prototype C — Canvas</title>
<link rel="stylesheet" href="shared/ux.css" />
<style>
  body { overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  /* Top toolbar */
  .toolbar { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; gap: 10px; align-items: center; padding: 8px 12px; z-index: 5; }
  .toolbar .brand { margin-right: 6px; white-space: nowrap; }
  .toolbar .ctrl { display: flex; align-items: center; gap: 6px; }
  .toolbar .ctrl > label { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .toolbar select { width: auto; min-width: 120px; padding: 5px 8px; }
  .toolbar .seg { margin: 0; }
  .toolbar .seg button { padding: 5px 10px; }
  /* Popover panels */
  .pop { position: fixed; top: 62px; right: 14px; width: 300px; padding: 14px; z-index: 6; }
  .pop h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .04em; }
  /* Bottom timeline */
  .scrubber { position: fixed; left: 14px; right: 14px; bottom: 14px; padding: 10px 14px; z-index: 5; }
  .scrubber .row1 { display: flex; align-items: center; gap: 12px; }
  .play { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--accent-dim); background: transparent; color: var(--accent); cursor: pointer; font-size: 15px; }
  .play:hover { background: rgba(0,255,255,.08); }
  .scrubber .timeline { flex: 1; }
  .scrubber .now { color: var(--accent); min-width: 116px; text-align: right; font-size: 12px; }
  .iconbtn { background: transparent; border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--muted); padding: 6px 10px; cursor: pointer; font: inherit; }
  .iconbtn:hover { color: var(--ink); border-color: var(--accent-dim); }
  .iconbtn.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div id="stage" class="stage"></div>

<!-- Top toolbar -->
<div class="toolbar glass">
  <h1 class="brand">Hydro-Art <span class="dot">◇</span></h1>
  <div class="ctrl"><label>State</label><select id="state"></select></div>
  <div class="ctrl"><label>Scope</label>
    <div class="seg" id="scope">
      <button data-v="state" class="active">State</button>
      <button data-v="county">County</button>
    </div>
  </div>
  <div class="ctrl" id="countyCtrl" hidden><label>County</label><select id="county"></select></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="styleBtn">◐ Style</button>
  <button class="iconbtn" id="glowBtn">✦ Glow</button>
  <button class="iconbtn on" id="exportBtn">⤓ Export</button>
</div>

<!-- Style popover -->
<div class="pop glass" id="stylePop" hidden>
  <h3>Style</h3>
  <label class="row">Color by</label>
  <div class="seg" id="colorMode">
    <button data-v="watershed" class="active">Watershed</button>
    <button data-v="single">Single</button>
    <button data-v="elevation">Elev</button>
  </div>
  <div id="paletteWrap">
    <label class="row">Palette</label>
    <select id="palette">
      <option value="neon">neon</option><option value="aurora">aurora</option>
      <option value="ember">ember</option><option value="ice">ice</option>
    </select>
    <div class="swatches" id="swatches"></div>
  </div>
  <div id="singleWrap" hidden>
    <label class="row">Single color</label>
    <input type="color" id="singleColor" value="#00e5ff" />
  </div>
  <label class="row">Line width mode</label>
  <div class="seg" id="widthMode">
    <button data-v="flow" class="active">By flow</button>
    <button data-v="uniform">Uniform</button>
  </div>
  <label class="row">Min width<span class="val" id="minVal">0.5px</span></label>
  <input type="range" id="minW" min="0.1" max="4" step="0.1" value="0.5" />
  <label class="row">Max width<span class="val" id="maxVal">2.0px</span></label>
  <input type="range" id="maxW" min="0.3" max="10" step="0.1" value="2.0" />
  <label class="row">Background</label>
  <input type="color" id="bg" value="#05060a" />
</div>

<!-- Glow popover -->
<div class="pop glass" id="glowPop" hidden>
  <h3>Glow</h3>
  <div class="seg" id="glowMode">
    <button data-v="off" class="active">Off</button>
    <button data-v="on">On</button>
  </div>
  <label class="row">Glow radius<span class="val" id="glowVal">2.5</span></label>
  <input type="range" id="glow" min="0.5" max="8" step="0.5" value="2.5" />
</div>

<!-- Export popover -->
<div class="pop glass" id="exportPop" hidden>
  <h3>Export & pipeline</h3>
  <div class="chips" id="fmt">
    <span class="chip active" data-v="svg">SVG</span>
    <span class="chip" data-v="png">PNG</span>
    <span class="chip" data-v="pdf">PDF</span>
  </div>
  <label class="row" style="margin-top:12px">build.py command</label>
  <pre id="cli" style="font-size:11px"></pre>
  <button class="btn solid" id="genBtn" style="margin-top:10px">⤓ Generate</button>
</div>

<!-- Bottom scrubber -->
<div class="scrubber glass">
  <div class="row1">
    <button class="play" id="play" title="Play year-in-motion">▶</button>
    <div class="seg" id="timeMode" style="margin:0; flex:0 0 auto">
      <button data-v="annual" class="active">Annual</button>
      <button data-v="single">Month</button>
      <button data-v="range">Range</button>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="now" id="now">Annual mean</div>
  </div>
</div>

<script src="shared/hydro-ux.js"></script>
<script>
"use strict";
const H = window.HydroUX, el = id => document.getElementById(id);
let net = null, playing = null;

const state = {
  state: "Washington", scope: "state", county: null,
  timeMode: "annual", monthStart: 0, monthEnd: 11, month: 6,
  colorMode: "watershed", palette: "neon", single: "#00e5ff", bg: "#05060a",
  widthMode: "flow", minW: 0.5, maxW: 2.0, gamma: 0.5, glow: false, glowR: 2.5, formats: ["svg"],
};

el("state").innerHTML = H.STATES.map(s => `<option value="${s.id}"${s.id===state.state?" selected":""}>${s.label}</option>`).join("");
function fillCounties(){ el("county").innerHTML = H.COUNTIES[state.state].map(c => `<option value="${c}">${c}</option>`).join(""); state.county = H.COUNTIES[state.state][0]; }
fillCounties();
function drawSwatches(){ el("swatches").innerHTML = H.PALETTES[state.palette].map(c=>`<i style="background:${c}"></i>`).join(""); }

// Timeline
function buildTimeline(){ el("timeline").innerHTML = H.MONTH_ABBR.map((m,i)=>`<div class="mo" data-m="${i}">${m}</div>`).join(""); paintTimeline(); }
function paintTimeline(){
  const active = state.timeMode !== "annual";
  el("timeline").style.opacity = active ? 1 : .4;
  el("timeline").style.pointerEvents = active ? "auto" : "none";
  [...el("timeline").children].forEach((c,i)=>{
    c.classList.remove("in-range","edge");
    if (state.timeMode === "single" && i === state.month) c.classList.add("edge");
    if (state.timeMode === "range"){
      if (i === state.monthStart || i === state.monthEnd) c.classList.add("edge");
      else if (i > state.monthStart && i < state.monthEnd) c.classList.add("in-range");
    }
  });
  el("now").textContent = state.timeMode === "annual" ? "Annual mean"
    : state.timeMode === "single" ? H.MONTH_ABBR[state.month]
    : `${H.MONTH_ABBR[state.monthStart]}–${H.MONTH_ABBR[state.monthEnd]} · ${H.MONTH_ABBR[state.month]}`;
}
el("timeline").addEventListener("click", e => {
  const c = e.target.closest(".mo"); if (!c) return;
  const m = +c.dataset.m;
  if (state.timeMode === "single"){ state.month = m; }
  else if (state.timeMode === "range"){
    if (Math.abs(m-state.monthStart) <= Math.abs(m-state.monthEnd)) state.monthStart = Math.min(m, state.monthEnd);
    else state.monthEnd = Math.max(m, state.monthStart);
    state.month = state.monthStart;
  }
  paintTimeline(); apply();
});

// Render
function rebuild(){ net = H.generateNetwork(H.hash(state.state)); el("stage").innerHTML = H.buildSvg(net); applyScope(); apply(); }
function applyScope(){
  const svg = el("stage").querySelector("svg"); if (!svg) return;
  if (state.scope === "county"){
    const w = net.viewBox.w, h = net.viewBox.h;
    svg.setAttribute("viewBox", `${w*0.30} ${h*0.55} ${w*0.34} ${h*0.34}`);
  } else svg.setAttribute("viewBox", `0 0 ${net.viewBox.w} ${net.viewBox.h}`);
}
function apply(){
  const svg = el("stage").querySelector("svg"); if (!svg) return;
  if (state.timeMode === "annual") state.month = 6;
  H.applyStyles(svg, net, state);
  document.body.style.background = state.bg;
  el("cli").textContent = H.cliMapping(state) + (state.formats.length ? `\n  --output ${state.formats.join(" ")}` : "");
}

// Play (year-in-motion): cycle through the selected range (or full year)
function togglePlay(){
  if (playing){ clearInterval(playing); playing = null; el("play").textContent = "▶"; return; }
  if (state.timeMode === "annual"){ state.timeMode = "range"; state.monthStart = 0; state.monthEnd = 11; setSeg("timeMode","range"); }
  el("play").textContent = "❚❚";
  playing = setInterval(() => {
    const lo = state.timeMode === "range" ? state.monthStart : 0;
    const hi = state.timeMode === "range" ? state.monthEnd : 11;
    state.month = state.month >= hi ? lo : state.month + 1;
    paintTimeline(); apply();
  }, 550);
}
el("play").addEventListener("click", togglePlay);

// Segmented helper
function setSeg(id, v){ [...el(id).children].forEach(x => x.classList.toggle("active", x.dataset.v===v)); }
function seg(id, key, after){
  el(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    setSeg(id, b.dataset.v); state[key] = b.dataset.v; (after||apply)();
  });
}
seg("scope","scope",()=>{ el("countyCtrl").hidden = state.scope!=="county"; applyScope(); apply(); });
seg("timeMode","timeMode",()=>{
  if (state.timeMode === "single") state.month = state.month ?? 6;
  if (state.timeMode === "range"){ if (state.monthEnd<=state.monthStart){ state.monthStart=0; state.monthEnd=11; } state.month = state.monthStart; }
  paintTimeline(); apply();
});
seg("colorMode","colorMode",()=>{
  el("paletteWrap").hidden = state.colorMode!=="watershed";
  el("singleWrap").hidden  = state.colorMode!=="single";
  apply();
});
seg("widthMode","widthMode");
el("glowMode").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  setSeg("glowMode", b.dataset.v); state.glow = b.dataset.v === "on"; apply();
});

// Toolbar popover toggles
function popToggle(btn, pop){
  el(btn).addEventListener("click", () => {
    const willShow = el(pop).hidden;
    ["stylePop","glowPop","exportPop"].forEach(p => el(p).hidden = true);
    ["styleBtn","glowBtn","exportBtn"].forEach(b => el(b).classList.remove("on"));
    el(pop).hidden = !willShow;
    el(btn).classList.toggle("on", willShow);
  });
}
popToggle("styleBtn","stylePop"); popToggle("glowBtn","glowPop"); popToggle("exportBtn","exportPop");

el("state").addEventListener("change", e => { state.state = e.target.value; fillCounties(); rebuild(); });
el("county").addEventListener("change", e => { state.county = e.target.value; applyScope(); apply(); });
el("palette").addEventListener("change", e => { state.palette = e.target.value; drawSwatches(); apply(); });
el("singleColor").addEventListener("input", e => { state.single = e.target.value; apply(); });
el("bg").addEventListener("input", e => { state.bg = e.target.value; apply(); });
el("fmt").addEventListener("click", e => { const c=e.target.closest(".chip"); if(!c) return; c.classList.toggle("active"); state.formats=[...el("fmt").querySelectorAll(".chip.active")].map(x=>x.dataset.v); apply(); });
el("genBtn").addEventListener("click", () => alert("Prototype: would run\n\n"+el("cli").textContent));
function bindRange(id, key, fmt, valId){ el(id).addEventListener("input", e => { state[key]=parseFloat(e.target.value); if(valId) el(valId).textContent=fmt(state[key]); apply(); }); }
bindRange("minW","minW", v=>v.toFixed(1)+"px", "minVal");
bindRange("maxW","maxW", v=>v.toFixed(1)+"px", "maxVal");
bindRange("glow","glowR", v=>v.toFixed(1), "glowVal");

// Boot
drawSwatches(); buildTimeline(); rebuild();
</script>
</body>
</html>
